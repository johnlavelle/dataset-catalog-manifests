# yaml-language-server: $schema=../schemas/dataset_manifest.schema.json
id: cmip6
# Legacy data on /net/isilon awaiting triage (Policy §7): roles, retention and
# licence are not yet agreed, so the entry stays 'proposed' until registered.
status: proposed

dataset:
  name: "CMIP6 EC-Earth3 Simulations"
  path: "/net/isilon/ifs/arch/home/shuting/ecearth3_exp"
  model: "EC-Earth3"
  domain: "Global"
  contact: "Shuting Yang <sy@dmi.dk>"
  description: "Raw model outputs of various CMIP6 experiments using climate model EC-Earth3 with multiple configurations (EC-Earth3, EC-Earth3-veg)."

storage:
  tier: legacy

stac:
  institution: "Danish Meteorological Institute (DMI)"
  purpose: "CMIP6 climate simulations with EC-Earth3"

products:
  # ── EC-Earth3 DECK ──────────────────────────────────────────────
  dpiC:
    name: "piControl (1000 years)"
    dir: "dpiC"
    category: "DECK"
    model_component: "EC-Earth3"
    experiment_id: "piControl"
    realization: "r5i1p1f1"
    modules: "output/ifs (001-999), output/nemo (001-999), post"
    type: "raw output"

  dA4x:
    name: "Abrupt 4xCO2"
    dir: "dA4x"
    category: "DECK"
    model_component: "EC-Earth3"
    experiment_id: "abrupt-4xCO2"
    realization: "r5i1p1f1"
    modules: "output/ifs (001-160), output/nemo (001-160)"
    type: "raw output"

  d1pc:
    name: "1% per year CO2"
    dir: "d1pc"
    category: "DECK"
    model_component: "EC-Earth3"
    experiment_id: "1pctCO2"
    realization: "r5i1p1f1"
    modules: "output/ifs (001-165), output/nemo (001-165)"
    type: "raw output"

  # ── EC-Earth3 Historical ────────────────────────────────────────
  dhi1:
    name: "Historical (r5)"
    dir: "dhi1"
    category: "CMIP"
    model_component: "EC-Earth3"
    experiment_id: "historical"
    realization: "r5i1p1f1"
    modules: "output/ifs (001-165), output/nemo (001-165), post, ForRCM, save_ic"
    type: "raw output"
    notes: "save_ic: initial conditions for DCPP (19511101-20141101)"

  dhi2:
    name: "Historical (r8)"
    dir: "dhi2"
    category: "CMIP"
    model_component: "EC-Earth3"
    experiment_id: "historical"
    realization: "r8i1p1f1"
    modules: "output/ifs (001-165), output/nemo (001-165)"
    type: "raw output"

  # ── EC-Earth3 ScenarioMIP ───────────────────────────────────────
  ds51:
    name: "SSP5-8.5 (r5)"
    dir: "ds51"
    category: "ScenarioMIP"
    model_component: "EC-Earth3"
    experiment_id: "ssp585"
    realization: "r5i1p1f1"
    modules: "output/ifs (001-086), output/nemo (001-086), post, ForRCM"
    type: "raw output"

  ds52:
