    type: "raw output"

  # ── EC-Earth3 DCPP ──────────────────────────────────────────────
  dcpp_r1_r5:
    name: "DCPP Hindcasts (r1-r5)"
    dir_pattern: "n[0-9][0-9][0-4]"
    category: "DCPP"
    model_component: "EC-Earth3"
    experiment_id: "dcppA-hindcast"
    realization: "r1i2p1f1 ... r5i2p1f1"
    modules: "output/ifs (001-011), output/nemo (001-011), post"
    type: "raw output"
    notes: "Dirs named nyyR: yy=60..21 (start year), R=0..4 (r1-r5). ~310 directories."

  dcpp_r11_r15:
    name: "DCPP Hindcasts (r11-r15)"
    dir_pattern: "d[0-9][0-9][0-4]"
    category: "DCPP"
    model_component: "EC-Earth3"
    experiment_id: "dcppA-hindcast"
    realization: "r11i2p1f1 ... r15i2p1f1"
    modules: "output/ifs (001-011), output/nemo (001-011), post"
    type: "raw output"
    notes: "Dirs named dyyR: yy=60..21 (start year), R=0..4 (r11-r15). ~310 directories."

