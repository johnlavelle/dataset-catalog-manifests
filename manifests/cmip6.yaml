    dir: "ds31"
    category: "ScenarioMIP"
    model_component: "EC-Earth3"
    experiment_id: "ssp370"
    realization: "r5i1p1f1"
    modules: "output/ifs (001-086), output/nemo (001-086), post, ForRCM"
