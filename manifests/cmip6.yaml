# yaml-language-server: $schema=../schemas/dataset_manifest.schema.json
id: cmip6
status: proposed

dataset:
  name: CMIP6 EC-Earth3 Simulations
  path: /net/isilon/ifs/arch/home/shuting/ecearth3_exp
  description: >-
    Raw model outputs of various CMIP6 experiments using climate model EC-Earth3 with multiple configurations
    (EC-Earth3, EC-Earth3-veg).
  model: EC-Earth3
  domain: Global
  contact: Shuting Yang <sy@dmi.dk>

storage:
  tier: legacy

stac:
  institution: Danish Meteorological Institute (DMI)
  purpose: CMIP6 climate simulations with EC-Earth3

products:
  dpiC:
    name: piControl (1000 years)
    dir: dpiC
    category: DECK
    model_component: EC-Earth3
    type: raw output
    experiment_id: piControl
    realization: r5i1p1f1
    modules: output/ifs (001-999), output/nemo (001-999), post

  dA4x:
    name: Abrupt 4xCO2
    dir: dA4x
    category: DECK
    model_component: EC-Earth3
    type: raw output
    experiment_id: abrupt-4xCO2
    realization: r5i1p1f1
    modules: output/ifs (001-160), output/nemo (001-160)

  d1pc:
    name: 1% per year CO2
    dir: d1pc
    category: DECK
    model_component: EC-Earth3
    type: raw output
    experiment_id: 1pctCO2
    realization: r5i1p1f1
    modules: output/ifs (001-165), output/nemo (001-165)

  dhi1:
    name: Historical (r5)
    dir: dhi1
    category: CMIP
    model_component: EC-Earth3
    type: raw output
    notes: "save_ic: initial conditions for DCPP (19511101-20141101)"
    experiment_id: historical
    realization: r5i1p1f1
    modules: output/ifs (001-165), output/nemo (001-165), post, ForRCM, save_ic

  dhi2:
