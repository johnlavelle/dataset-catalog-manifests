# Jobs run on the Matrix cluster, which reaches PyPI and npm only through DMI's proxy
# (Confluence: IT Network - Basale Services). DMI hosts, GitLab included, are reached directly.
variables:
  HTTP_PROXY: http://squid1.dmi.dk:3128
  HTTPS_PROXY: http://squid1.dmi.dk:3128
  NO_PROXY: localhost,127.0.0.1,.dmi.dk
  http_proxy: http://squid1.dmi.dk:3128
  https_proxy: http://squid1.dmi.dk:3128
  no_proxy: localhost,127.0.0.1,.dmi.dk

validate:
  image: python:3.11-slim
  before_script:
    - pip install -r requirements.txt
  script:
    - python scripts/validate_manifests.py
  rules:
    - changes:
        - manifests/*.yaml
        - manifests/*.yml
        - examples/*.yaml
        - registry/*.yaml
        - schemas/*.json
        - .gitlab-ci.yml
        - scripts/validate_manifests.py

# Every manifest opens in the web editor and is saved back without losing or changing data
editor-compat:
  image: node:20-slim
  script:
    - cd web && npm ci && npm run check:manifests
  rules:
    - changes:
        - manifests/*.yaml
        - manifests/*.yml
        - examples/*.yaml
        - registry/*.yaml
        - schemas/*.json
        - .gitlab-ci.yml
        - web/**/*

# The editor survives malformed manifests: wrong types in every field render, never crash
editor-robustness:
  image: node:20-slim
  script:
    - cd web && npm ci && npm run check:robustness
  rules:
    - changes:
        - examples/*.yaml
        - registry/*.yaml
        - schemas/*.json
        - .gitlab-ci.yml
        - web/**/*

# Publishes the web editor; only from the default branch, so feature branches don't overwrite it
pages:
  image: node:20-slim
  script:
    - cd web && npm ci && npm run build
    - mv dist ../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - web/**/*
        - schemas/*.json
        - .gitlab-ci.yml
        - examples/*.yaml
        - registry/*.yaml
