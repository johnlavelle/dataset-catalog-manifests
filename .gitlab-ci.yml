validate:
  image: python:3.11-slim
  before_script:
    - pip install -r requirements.txt
  script:
    - python scripts/validate_manifests.py
  rules:
    - changes:
        - manifests/*.yaml
        - manifests/*.yml
        - examples/*.yaml
        - registry/*.yaml
        - schemas/*.json
        - scripts/validate_manifests.py

# Every manifest opens in the web editor and is saved back without losing or changing data
editor-compat:
  image: node:20-slim
  script:
    - cd web && npm ci && npm run check:manifests
  rules:
    - changes:
        - manifests/*.yaml
        - manifests/*.yml
        - examples/*.yaml
        - registry/*.yaml
        - schemas/*.json
        - web/**/*

# The editor survives malformed manifests: wrong types in every field render, never crash
editor-robustness:
  image: node:20-slim
  script:
    - cd web && npm ci && npm run check:robustness
  rules:
    - changes:
        - examples/*.yaml
        - registry/*.yaml
        - schemas/*.json
        - web/**/*

# Publishes the web editor; only from the default branch, so feature branches don't overwrite it
pages:
  image: node:20-slim
  script:
    - cd web && npm ci && npm run build
    - mv dist ../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - web/**/*
        - schemas/*.json
        - examples/*.yaml
        - registry/*.yaml
