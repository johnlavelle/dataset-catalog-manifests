validate:
  image: python:3.11-slim
  before_script:
    - pip install -r requirements.txt
  script:
    - python scripts/validate_manifests.py
  rules:
    - changes:
        - manifests/*.yaml
        - manifests/*.yml
        - schemas/*.json
        - scripts/validate_manifests.py

pages:
  image: node:20-slim
  script:
    - cd web && npm ci && npm run build
    - mv dist ../public
  artifacts:
    paths:
      - public
  rules:
    - changes:
        - web/**/*
        - schemas/*.json
