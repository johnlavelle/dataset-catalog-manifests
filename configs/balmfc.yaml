  # NORDIC ERGOM BGC
  NORDIC_12h_ERGOM_T:
    name: "NORDIC BGC 12-hourly"
    dir: "NORDIC_12h_ERGOM_T"
    category: "Biogeochemistry"
    model_component: "ERGOM"
    domain: "Nordic+Baltic"
    type: "original output"
